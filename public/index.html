<style>
:root{--bg:#fff;--fg:#14213d;--mu:#5b6478;--b:#1e56d6;--r:#e53935;--c:#f4f7fd;--bd:#e3e8f2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1424;--fg:#eef2fb;--mu:#9aa6c0;--b:#5b8cff;--c:#172038;--bd:#27314d;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1424;--fg:#eef2fb;--mu:#9aa6c0;--b:#5b8cff;--c:#172038;--bd:#27314d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Arial Rounded MT Bold","Arial Rounded MT",Arial,sans-serif;line-height:1.45}
button,input,select{font:inherit;color:inherit}a{color:var(--b)}
.top{background:var(--b);color:#fff;text-align:center;font-size:12px;padding:6px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer}.lt{line-height:1.05}.lt b{display:block;font-family:Georgia,'Times New Roman',serif;font-size:21px;letter-spacing:2.500px;color:var(--b)}.lt small{display:block;font-size:9.500px;letter-spacing:3.200px;color:var(--r);font-weight:700;margin-top:2px}
.s{flex:1;min-width:150px;border:2px solid var(--b);border-radius:24px;padding:8px 14px;background:var(--bg)}
.nb{background:none;border:0;cursor:pointer;font-size:14px;padding:6px 8px;border-radius:10px}.nb:hover{background:var(--c)}
.badge{background:var(--r);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:3px}
main{max-width:1100px;margin:auto;padding:14px}
.hero{background:linear-gradient(120deg,var(--b),#0b2f8f);color:#fff;border-radius:20px;padding:26px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0 0 14px;opacity:.9}.hi{font-size:70px}
.btn{border:0;border-radius:24px;padding:10px 20px;cursor:pointer;background:var(--b);color:#fff;font-weight:700}.btn.r{background:var(--r)}.btn.o{background:none;border:2px solid var(--b);color:var(--b)}.btn.w{width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0}.chip{border:1px solid var(--bd);background:var(--c);border-radius:20px;padding:6px 14px;cursor:pointer;white-space:nowrap}.chip.on{background:var(--b);color:#fff;border-color:var(--b)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;gap:8px}
select,.in{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:var(--bg);width:100%}select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{border:1px solid var(--bd);border-radius:16px;overflow:hidden;background:var(--bg);position:relative}
.im{background:var(--c);font-size:56px;text-align:center;padding:18px 0;cursor:pointer}
.cb{padding:10px}.cb h4{margin:0 0 4px;font-size:14px;cursor:pointer;height:36px;overflow:hidden}
.pr{color:var(--b);font-weight:700}.old{color:var(--mu);text-decoration:line-through;font-size:12px;margin-left:5px}
.off{position:absolute;top:8px;left:8px;background:var(--r);color:#fff;border-radius:8px;font-size:11px;padding:2px 7px}
.hb{position:absolute;top:6px;right:8px;background:none;border:0;font-size:20px;cursor:pointer}
.mu{color:var(--mu);font-size:13px}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:22px 0}.feats div{background:var(--c);border-radius:14px;padding:14px;font-size:14px}
.box{border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}.hi{display:none}}
.row{display:flex;justify-content:space-between;gap:8px;margin:6px 0}.row.t{font-weight:700;font-size:18px;color:var(--r)}
label{display:block;font-size:13px;margin:10px 0 4px;color:var(--mu)}
.pay{display:flex;flex-wrap:wrap;gap:8px}.pay label{margin:0;border:1px solid var(--bd);border-radius:12px;padding:8px 12px;cursor:pointer;color:var(--fg)}
.drawer{position:fixed;top:0;right:-100%;width:min(400px,100%);height:100%;background:var(--bg);z-index:20;transition:right .25s;box-shadow:-4px 0 20px #0004;padding:16px;overflow:auto;padding-top:calc(16px + env(safe-area-inset-top,0px))}.drawer.on{right:0}
.modal{position:fixed;inset:0;background:#0007;z-index:30;display:none;align-items:center;justify-content:center;padding:14px}.modal.on{display:flex}.mc{background:var(--bg);border-radius:18px;padding:20px;width:min(420px,100%);max-height:90%;overflow:auto}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs .chip{flex:1;text-align:center}
.ci{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--bd);padding:8px 0}.ci .e{font-size:30px}.q button{width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);background:var(--c);cursor:pointer}
.st{border-radius:10px;padding:2px 10px;font-size:12px;color:#fff;background:var(--b)}.st.Delivered{background:#2e9e5b}.st.Cancelled{background:var(--r)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:20px;z-index:50;display:none}
@media print{body>*:not(.modal){display:none}.modal{position:static;background:none}}a.btn{text-decoration:none;display:inline-block}.bdg{position:absolute;top:34px;left:8px;background:var(--b);color:#fff;border-radius:8px;font-size:10px;padding:2px 7px}.kp b{font-size:22px}.bar2{background:var(--b);border-radius:6px 6px 0 0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bd);margin-right:4px}.dot.on{background:var(--b)}
footer{background:var(--c);padding:22px 14px;text-align:center;color:var(--mu);font-size:13px;margin-top:30px}
</style></head><body>
<div class=top>🎁 Free delivery on any 2 items &bull; Dhaka ৳80 / Outside ৳120 &bull; Cash on Delivery &bull; bKash / Nagad / Rocket</div>
<header><div class=logo onclick="location.hash='/'" role=img aria-label="Jannat Fashion Mart"><svg width='38' height='38' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='hg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#2f6bff'/><stop offset='1' stop-color='#0a2a86'/></linearGradient></defs><rect width='64' height='64' rx='15' fill='url(#hg)'/><path d='M32 10.5a4 4 0 1 1 4 4c-2 .3-4 1.6-4 4V22' fill='none' stroke='#fff' stroke-width='3' stroke-linecap='round'/><path d='M32 22 51 35.500c2 1.400 1 3.500-1.200 3.500H14.200c-2.200 0-3.200-2.100-1.200-3.500Z' fill='none' stroke='#fff' stroke-width='3' stroke-linejoin='round'/><text x='32' y='55.500' text-anchor='middle' font-family='Georgia,Times New Roman,serif' font-weight='700' font-size='16.500' letter-spacing='1' fill='#fff'>JFM</text><rect x='19' y='58' width='26' height='2.200' rx='1.100' fill='#e53935'/></svg><span class=lt><b>JANNAT</b><small>FASHION MART</small></span></div><input class=s id=q placeholder="Search products..." oninput="F.q=this.value;location.hash!='#/'&&(location.hash='/');R()"><button class=nb onclick="location.hash='/track'">Track</button><button class=nb id=ab onclick="acc()">Login</button><button class=nb onclick="dr(1)">🛒<span class=badge id=cc>0</span></button></header>
<main id=app></main>
<footer><b>Jannat Fashion Mart</b> &bull; Bangladesh &bull; Hotline 16000<br><a href="#/admin">Admin</a></footer>
<aside class=drawer id=d></aside><div class=modal id=m onclick="if(event.target==this)this.classList.remove('on')"><div class=mc id=mc></div></div><div id=toast></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),tk=n=>'৳'+Math.round(n).toLocaleString('en-IN');
const S={g(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const cats=['Sarees','Electronics','Fashion','Home','Beauty','Grocery','Books'],divs=['Dhaka','Chattogram','Rajshahi','Khulna','Barishal','Sylhet','Rangpur','Mymensingh'];
let db={products:[],users:[],orders:[],coupons:[],set:{ph:'16000',wa:'8801700000000',dh:80,ds:120,fq:2,fa:999999}};
const me=()=>S.g('bz_u',null),API=window.BAZAR_API||'/api',setAuth=d=>{S.s('bz_t',d.token);S.s('bz_u',d.user)};
async function call(m,p,b){const t=S.g('bz_t','');let r;try{r=await fetch(API+p,{method:m,headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})},body:b?JSON.stringify(b):undefined})}catch(e){throw new Error('Cannot reach server')}let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'Request failed');return d}
/* ===== REST API client - every call hits the Node server (see server.js) ===== */
const api={
 products:(o={})=>call('GET','/products?'+new URLSearchParams({q:o.q||'',cat:o.cat||'All',sort:o.sort||'pop'})), /* GET /api/products */
 product:id=>call('GET','/products/'+id), /* GET /api/products/:id */
 register:async u=>{const d=await call('POST','/auth/register',u);setAuth(d);await sync();return d.user}, /* POST /api/auth/register */
 login:async(e,p)=>{const d=await call('POST','/auth/login',{email:e,pass:p});setAuth(d);await sync();return d.user}, /* POST /api/auth/login */
 logout:async()=>{S.s('bz_t','');S.s('bz_u',null);db.orders=[];db.coupons=[];db.users=[];await sync()},
 coupon:(c,sub)=>call('POST','/coupons/validate',{code:c,subtotal:sub}), /* POST /api/coupons/validate */
 order:p=>call('POST','/orders',p), /* POST /api/orders (guest or logged in) */
 orders:()=>call('GET','/orders/mine'), /* GET /api/orders/mine */
 track:(id,ph)=>call('GET','/orders/track?'+new URLSearchParams({id,phone:ph})), /* GET /api/orders/track */
 allOrders:async()=>db.orders=await call('GET','/admin/orders') /* GET /api/admin/orders */
};
async function sync(){try{[db.products,db.set]=await Promise.all([call('GET','/products'),call('GET','/settings')])}catch(e){toast(e.message)}
 if(S.g('bz_t','')){try{S.s('bz_u',await call('GET','/auth/me'))}catch(e){if(e.message!='Cannot reach server'){S.s('bz_t','');S.s('bz_u',null)}}}
 const u=me();if(u&&u.role=='admin'){try{[db.products,db.orders,db.coupons,db.users]=await Promise.all([call('GET','/admin/products'),call('GET','/admin/orders'),call('GET','/admin/coupons'),call('GET','/admin/users')])}catch(e){toast(e.message)}}}
let cart=S.g('bz_c',[]),wish=S.g('bz_w',[]),cp=null,F={q:'',cat:'All',sort:'pop'};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)};
const sv=()=>{S.s('bz_c',cart);S.s('bz_w',wish);$('#cc').textContent=cart.reduce((a,b)=>a+b.q,0);const u=me();$('#ab').textContent=u?'Hi, '+u.name.split(' ')[0]:'Login';dc()};
const pid=id=>db.products.find(p=>p.id==id);
const sub=()=>cart.reduce((a,i)=>a+pid(i.id).price*i.q,0);
const qn=()=>cart.reduce((a,b)=>a+b.q,0),ship=(dv,s)=>qn()>=db.set.fq||s>=db.set.fa?0:dv=='Dhaka'?db.set.dh:db.set.ds;
const add=(id,q=1)=>{const p=pid(id),i=cart.find(c=>c.id==id);if((i?i.q:0)+q>p.stock)return toast('Only '+p.stock+' in stock');i?i.q+=q:cart.push({id,q});sv();toast('Added to cart')};
const chg=(id,d)=>{const i=cart.find(c=>c.id==id);i.q+=d;if(i.q<1)cart=cart.filter(c=>c!=i);else if(i.q>pid(id).stock){i.q--;toast('Stock limit reached')}cp=null;sv()};
const tw=id=>{wish=wish.includes(id)?wish.filter(w=>w!=id):[...wish,id];sv();R()};
const dr=o=>$('#d').classList.toggle('on',!!o);
function dc(){$('#d').innerHTML=`<div class=row><h3 style=margin:0>Your Cart</h3><button class=nb onclick=dr(0)>✕</button></div>`+(cart.length?cart.map(i=>{const p=pid(i.id);return`<div class=ci><div class=e>${p.img}</div><div style=flex:1><div>${esc(p.name)}</div><div class=pr>${tk(p.price)}</div></div><div class=q><button onclick="chg(${p.id},-1)">−</button> ${i.q} <button onclick="chg(${p.id},1)">+</button></div></div>`}).join('')+`<div class=row t style=margin-top:12px><span>Subtotal</span><b>${tk(sub())}</b></div><button class="btn r w" onclick="dr(0);location.hash='/checkout'">Checkout</button><p class=mu style=text-align:center>${qn()>=db.set.fq?'🎉 Free delivery unlocked!':'🎁 Add '+(db.set.fq-qn())+' more item(s) for FREE delivery'}<br>Guest checkout - no account needed.</p>`:'<p class=mu>Your cart is empty.</p>')}
function acc(){const u=me();if(u){location.hash='/account';return}auth('login')}
function auth(t){$('#mc').innerHTML=`<div class=tabs><button class="chip ${t=='login'?'on':''}" onclick="auth('login')">Login</button><button class="chip ${t=='signup'?'on':''}" onclick="auth('signup')">Sign up</button></div>${t=='signup'?'<label>Full name</label><input class=in id=an>':''}<label>Email</label><input class=in id=ae type=email><label>Password</label><input class=in id=ap type=password><p id=ar style="color:var(--r);font-size:13px"></p><button class="btn w" onclick="go2('${t}')">${t=='login'?'Login':'Create account'}</button><p class=mu>Account is optional - you can always checkout as a guest.</p>`;$('#m').classList.add('on')}
async function go2(t){try{t=='login'?await api.login($('#ae').value,$('#ap').value):await api.register({name:$('#an').value||'Customer',email:$('#ae').value,pass:$('#ap').value});$('#m').classList.remove('on');sv();R();toast('Welcome!')}catch(e){$('#ar').textContent=e&&e.message||'Password must be at least 6 characters'}}
const card=p=>`<div class=card>${p.badge?`<span class=bdg>${esc(p.badge)}</span>`:''}${p.old>p.price?`<span class=off>-${Math.round(100-p.price/p.old*100)}%</span>`:''}<button class=hb onclick="tw(${p.id})">${wish.includes(p.id)?'❤️':'🤍'}</button><div class=im onclick="location.hash='/p/${p.id}'">${p.img}</div><div class=cb><h4 onclick="location.hash='/p/${p.id}'">${esc(p.name)}</h4><div class=mu>⭐ ${p.rating} &bull; ${p.stock>0?'In stock':'Sold out'}</div><div><span class=pr>${tk(p.price)}</span><span class=old>${tk(p.old)}</span></div><button class="btn w" style="margin-top:8px;padding:8px" ${p.stock?'':'disabled'} onclick="add(${p.id})">${p.stock?'Add to cart':'Coming soon'}</button></div></div>`;
const V={
async home(){const ps=await api.products(F);return`<section class=hero><div><h1>Shop smart across Bangladesh</h1><p>Genuine products, 64-district delivery, Cash on Delivery &amp; bKash.</p><button class="btn r" onclick="document.getElementById('g').scrollIntoView()">Shop now</button></div><div class=hi>🛍️</div></section><div class=chips>${['All',...cats].map(c=>`<button class="chip ${F.cat==c?'on':''}" onclick="F.cat='${c}';R()">${c}</button>`).join('')}</div><div class=bar id=g><b>${ps.length} products</b><select onchange="F.sort=this.value;R()">${[['pop','Popular'],['low','Price: low to high'],['high','Price: high to low'],['rate','Top rated']].map(o=>`<option value=${o[0]} ${F.sort==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div class=grid>${ps.map(card).join('')||'<p>No products found.</p>'}</div><div class=feats><div>🚚 <b>Fast delivery</b><br>Dhaka 1-2 days, outside 3-5 days</div><div>💵 <b>Cash on Delivery</b><br>Pay when you receive</div><div>📲 <b>bKash / Nagad / Rocket</b><br>Secure mobile payments</div><div>↩️ <b>7-day returns</b><br>Easy and hassle free</div></div>`},
async p(id){const p=await api.product(id);if(!p)return'<p>Product not found.</p>';const rel=(await api.products({cat:p.cat})).filter(x=>x.id!=p.id).slice(0,4);return`<div class=two><div class="box im" style="font-size:120px">${p.img}</div><div class=box><span class=mu>${p.cat}</span><h2 style=margin:4px 0>${esc(p.name)}</h2><div class=mu>⭐ ${p.rating} &bull; ${p.sold} sold</div><div style="font-size:26px;margin:8px 0"><span class=pr>${tk(p.price)}</span><span class=old>${tk(p.old)}</span></div><p>${p.desc}</p><p class=mu>${p.stock?p.stock+' units available':'Out of stock'}</p><div style="display:flex;gap:8px"><button class=btn ${p.stock?'':'disabled'} onclick="add(${p.id})">Add to cart</button><button class="btn r" ${p.stock?'':'disabled'} onclick="add(${p.id});location.hash='/checkout'">Buy now</button></div><div class=mu style=margin-top:12px>✅ 100% original &bull; 💵 Pay after receiving &bull; 🔄 Check product at delivery &bull; 🎁 Free delivery on any 2 items</div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><a class="btn o" href="tel:${db.set.ph}">📞 Call</a><a class="btn o" target=_blank href="https://wa.me/${db.set.wa}?text=${encodeURIComponent('I want to order: '+p.name)}">💬 WhatsApp</a><button class="btn o" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);toast('Link copied')">🔗 Share</button></div></div></div><h3>Related products</h3><div class=grid>${rel.map(card).join('')}</div>`},
async checkout(){if(!cart.length)return'<div class=box>Your cart is empty. <a href="#/">Continue shopping</a></div>';const u=me(),s=sub(),dv=$('#dv')?$('#dv').value:'Dhaka';return`<h2>Checkout</h2>${u?'':'<div class=box style="background:var(--c)">Checking out as <b>guest</b>. <a href=# onclick="auth(\'login\');return false">Login</a> or <a href=# onclick="auth(\'signup\');return false">sign up</a> to track orders easily.</div>'}<div class=two><div class=box><label>Full name</label><input class=in id=cn value="${esc($('#cn')?$('#cn').value:u?u.name:'')}"><label>Mobile (01XXXXXXXXX)</label><input class=in id=cph inputmode=numeric maxlength=11 value="${esc($('#cph')?$('#cph').value:'')}"><label>Email (optional)</label><input class=in id=cem value="${u?esc(u.email):''}"><label>Division</label><select id=dv style=width:100% onchange="R()">${divs.map(d=>`<option ${d==dv?'selected':''}>${d}</option>`).join('')}</select><label>Full address (district, thana, area, house)</label><input class=in id=ca value="${esc($('#ca')?$('#ca').value:'')}"><label>Payment method</label><div class=pay>${['Cash on Delivery','bKash','Nagad','Rocket','Card'].map((m,i)=>`<label><input type=radio name=pm value="${m}" ${i?'':'checked'} onchange="pmc()"> ${m}</label>`).join('')}</div><div id=tx style=display:none><label>Send money to <b>01700-000000</b> then enter TrxID</label><input class=in id=ctx></div></div><div class=box><h3 style=margin-top:0>Order summary</h3>${cart.map(i=>`<div class=row><span>${pid(i.id).name} × ${i.q}</span><span>${tk(pid(i.id).price*i.q)}</span></div>`).join('')}<div style=display:flex;gap:6px;margin:10px 0><input class=in id=cc2 placeholder="Coupon (WELCOME10, BD50)" value="${cp?cp.code:''}"><button class="btn o" onclick="apc()">Apply</button></div><div class=row><span>Subtotal</span><span>${tk(s)}</span></div>${cp?`<div class=row><span>Discount</span><span>-${tk(cp.off)}</span></div>`:''}<div class=row><span>Delivery</span><span>${ship(dv,s)?tk(ship(dv,s)):'Free'}</span></div><div class="row t"><span>Total</span><span>${tk(s-(cp?cp.off:0)+ship(dv,s))}</span></div><p id=er style="color:var(--r)"></p><button class="btn r w" onclick="place()">Place order</button></div></div>`},
async done(id){return`<div class=box style=text-align:center><div style=font-size:60px>✅</div><h2>Order placed!</h2><p>Your Order ID: <b>${esc(id)}</b></p><p class=mu>Our team will call you shortly to confirm. Pay when you receive the parcel. Save this ID + your phone to track the order.</p><button class=btn onclick="location.hash='/track'">Track order</button> <button class="btn o" onclick="location.hash='/'">Continue shopping</button></div>`},
